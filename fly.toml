# Fly.io: fly launch --no-deploy (keep this file), fly volumes create rota_data --size 1 --region lhr,
# fly secrets set MANAGER_PIN=123456 STAFF_PIN=2468, then fly deploy.
app = "manor-rota"            # change to a name nobody else has used
primary_region = "lhr"        # London

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"  # keep it running so live updates and daily backups work
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[mounts]
  source = "rota_data"
  destination = "/data"
